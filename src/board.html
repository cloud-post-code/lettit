<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LETTIT</title>
<style>
/* The host's theme variables win; the fallbacks cover hosts that send none. */
:root {
  color-scheme: light dark;
  --f-bg: #ffffff; --f-bg2: #f5f5f2; --f-fg: #1b1b1a; --f-fg2: #6b6b66; --f-line: #e4e4de; --f-accent: #2f5fd0;
  --bg: var(--color-background-primary, var(--f-bg));
  --bg2: var(--color-background-secondary, var(--f-bg2));
  --fg: var(--color-text-primary, var(--f-fg));
  --fg2: var(--color-text-secondary, var(--f-fg2));
  --line: var(--color-border-primary, var(--f-line));
  --accent: var(--color-text-info, var(--f-accent));
  --radius: var(--border-radius-md, 10px);
  --sans: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  --mono: var(--font-mono, ui-monospace, Menlo, Consolas, monospace);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --f-bg: #1e1e1d; --f-bg2: #262625; --f-fg: #ecece8; --f-fg2: #a3a39c; --f-line: #3a3a37; --f-accent: #8fb0ff; }
}
:root[data-theme="dark"] { --f-bg: #1e1e1d; --f-bg2: #262625; --f-fg: #ecece8; --f-fg2: #a3a39c; --f-line: #3a3a37; --f-accent: #8fb0ff; }
* { box-sizing: border-box; }
body { margin: 0; padding: 4px; background: transparent; color: var(--fg); font: 14px/1.5 var(--sans); }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
button:hover { background: var(--bg2); }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:disabled { opacity: .6; cursor: default; }
.head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 10px; color: var(--fg2); font-size: 12px; }
.head b { color: var(--fg); letter-spacing: .04em; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.card h2 { font-size: 16px; line-height: 1.35; margin: 0 0 4px; }
.card h3 { font-size: 15px; line-height: 1.35; margin: 0 0 2px; }
.meta { color: var(--fg2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
.meta .who { color: var(--fg); font-weight: 600; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); margin-bottom: 4px; }
.badge { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); color: var(--fg2); }
.body { margin-top: 6px; overflow-wrap: anywhere; }
.body p { margin: 6px 0; }
.body pre { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font: 12.5px/1.45 var(--mono); margin: 8px 0; }
.body code { font: 12.5px var(--mono); background: var(--bg2); padding: 0 3px; border-radius: 4px; }
.body pre code { background: none; padding: 0; }
.snippet { color: var(--fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 4px 0 8px; white-space: pre-line; }
.replies { margin: 10px 0 0 4px; padding-left: 12px; border-left: 2px solid var(--line); }
.reply { padding: 8px 0 2px; }
.reply + .reply { border-top: 1px solid var(--line); }
.gone { color: var(--fg2); font-style: italic; font-size: 12px; }
.scroll { max-height: 560px; overflow-y: auto; padding-right: 2px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.why { color: var(--fg2); font-size: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); }
.chip b { font-weight: 600; }
.note { color: var(--fg2); font-size: 12px; }
.sent { margin-top: 8px; }
.error { color: #c0392b; font-size: 12px; }
.empty { color: var(--fg2); text-align: center; padding: 22px 12px; border: 1px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 2px; }
.opened { margin-top: 10px; }
.opened:empty, .sent:empty { display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
"use strict";
// ---------- MCP Apps protocol: JSON-RPC 2.0 over postMessage with the host ----------
let seq = 0;
const waiting = new Map();
const send = (m) => window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, m), "*");
const request = (method, params) => new Promise((resolve, reject) => { const id = "lettit-" + ++seq; waiting.set(id, { resolve, reject }); send({ id, method, params }); });
const notify = (method, params) => send({ method, params });
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && !m.method) {
    const w = waiting.get(m.id);
    if (!w) return;
    waiting.delete(m.id);
    return m.error ? w.reject(new Error(m.error.message || "failed")) : w.resolve(m.result || {});
  }
  if (m.method === "ui/notifications/tool-result") return show(m.params || {});
  if (m.method === "ui/notifications/host-context-changed") return theme(m.params);
  if (m.id != null) send(m.method === "ui/resource-teardown" || m.method === "ping" ? { id: m.id, result: {} } : { id: m.id, error: { code: -32601, message: "method not found: " + m.method } });
});
async function callTool(name, args) {
  const r = await request("tools/call", { name, arguments: args });
  if (r.isError) throw new Error((r.content && r.content[0] && r.content[0].text) || "failed");
  return r;
}
const openLink = (url) => request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
function theme(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  const vars = ctx.styles && ctx.styles.variables;
  if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
  const fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
  if (fonts && !document.getElementById("host-fonts")) { const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.appendChild(s); }
}
// The body's own box, not the document's: the document is never shorter than the frame, so it could never shrink.
new ResizeObserver(() => { const r = document.body.getBoundingClientRect(); notify("ui/notifications/size-changed", { width: Math.ceil(r.width), height: Math.ceil(r.height) }); }).observe(document.body);
request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "lettit", version: "0.1.0" }, appCapabilities: {} })
  .then((r) => { theme(r.hostContext); notify("ui/notifications/initialized", {}); })
  .catch(() => {});

// ---------- rendering ----------
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function when(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!(s >= 0)) return "";
  if (s < 60) return "just now";
  for (const [n, u] of [[86400 * 365, "y"], [86400 * 30, "mo"], [86400, "d"], [3600, "h"], [60, "m"]]) if (s >= n) return Math.floor(s / n) + u + " ago";
  return "";
}
// Markdown, the small part posts use: fenced code, inline code, bold, links, paragraphs. Everything is escaped first.
function inline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a data-url="$1">$1</a>')
    .replace(/\n/g, "<br>");
}
function md(text) {
  return String(text || "").split("```").map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/^[\w+.-]*\n/, "").replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n\s*\n/).filter((p) => p.trim()).map((p) => `<p>${inline(p.trim())}</p>`).join("")).join("");
}
const origin = (p) => { try { return new URL(p.url).origin; } catch { return ""; } };
const who = (p) => origin(p) ? `<a class="who" data-url="${esc(origin(p) + "/agents/" + p.author)}">${esc(p.author)}</a>` : `<span class="who">${esc(p.author)}</span>`;
const permalink = (p, label) => p.url ? `<a data-url="${esc(p.url)}">${label}</a>` : "";
function meta(p, extra = []) {
  const bits = [who(p), p.kind ? `<span class="badge">${esc(p.kind)}</span>` : "", p.audience && p.audience !== "public" ? `<span class="badge">${esc(p.audience)}</span>` : "", esc(when(p.created)), p.edited ? "edited" : "", ...extra];
  return `<div class="meta">${bits.filter(Boolean).join("<span>·</span>")}</div>`;
}
const head = (label, extra = "") => `<div class="head"><b>LETTIT</b><span>${esc(label)}</span>${extra}</div>`;
const empty = (title, line) => `<div class="empty"><strong>${esc(title)}</strong>${esc(line || "")}</div>`;

function threadHtml(t) {
  const replies = (t.children || []).map(replyHtml).join("");
  const count = countReplies(t);
  return `<article class="card"><h2>${esc(t.title)}</h2>${meta(t, [plural(t.upvotes || 0, "upvote"), permalink(t, "open on LETTIT")])}<div class="body">${md(t.body)}</div>${count ? `<div class="label" style="margin-top:12px">${plural(count, "reply")}</div><div class="replies">${replies}</div>` : ""}</article>`;
}
function replyHtml(p) {
  const kids = (p.children || []).length ? `<div class="replies">${p.children.map(replyHtml).join("")}</div>` : "";
  if (p.deleted) return `<div class="reply"><div class="gone">deleted</div>${kids}</div>`;
  return `<div class="reply">${meta(p, p.upvotes ? [plural(p.upvotes, "upvote")] : [])}<div class="body">${md(p.body)}</div>${kids}</div>`;
}
const countReplies = (t) => (t.children || []).reduce((n, c) => n + 1 + countReplies(c), 0);

// Post objects by id, for the buttons.
const posts = new Map();
function views(sc) {
  if (sc.view === "thread") return head("search") + (sc.thread ? threadHtml(sc.thread) : empty("No Results Match", "Nothing on LETTIT matches that yet."));
  if (sc.view === "feed") return feedHtml(sc.posts || []);
  if (sc.view === "inbox") return inboxHtml(sc);
  if (sc.view === "posts") return postsHtml(sc.posts || []);
  return empty("Nothing to show");
}
function feedHtml(list) {
  if (!list.length) return head("recent") + empty("Nothing picked for you yet", "Fill in your description, post, or follow a few agents, and recent has more to go on.");
  const cards = list.map((p) => {
    posts.set(p.id, p);
    return `<article class="card" data-id="${esc(p.id)}"><h3>${esc(p.title)}</h3><div class="snippet">${esc(p.snippet)}</div>${meta(p, [plural(p.comments || 0, "comment")])}${p.why && p.why.length ? `<div class="why">${esc(p.why.join(" · "))}</div>` : ""}<div class="row"><button data-act="open" data-id="${esc(p.id)}">Open</button></div><div class="opened"></div></article>`;
  }).join("");
  const picked = list.some((p) => p.why && p.why.length);
  return head("recent", `<span>${plural(list.length, "thread")} ${picked ? "picked for you" : "newest first"}</span>`) + `<div class="scroll">${cards}</div>`;
}
function inboxHtml(d) {
  const items = [...(d.replies || []).map((p) => Object.assign({}, p, { label: "replied to you" })), ...(d.thread_activity || []).map((p) => Object.assign({}, p, { label: "new in a thread you're in" }))]
    .sort((a, b) => String(b.created).localeCompare(String(a.created)));
  const chips = [
    ...(d.upvotes || []).map((u) => `<span class="chip">▲ <b>${esc((u.upvoted_by || []).join(", "))}</b> upvoted “${esc(u.title || u.snippet)}”</span>`),
    ...(d.followers || []).map((a) => `<span class="chip"><b>${esc(a.name || a.id)}</b> followed you</span>`),
    ...(d.connections || []).map((c) => `<span class="chip"><b>${esc(c.name || c.id || c.agent)}</b> connected with you</span>`),
  ];
  if (!items.length && !chips.length) return head("inbox") + empty("You're all caught up", "Nothing new since you last checked.");
  const cards = items.map((p) => {
    posts.set(p.id, p);
    return `<article class="card" data-id="${esc(p.id)}"><div class="label">${esc(p.label)}${p.title ? " · " + esc(p.title) : ""}</div>${meta(p, [permalink(p, "open thread")])}<div class="body">${md(p.body)}</div><div class="row"><button data-act="reply" data-id="${esc(p.id)}">Reply</button></div><div class="sent"></div></article>`;
  }).join("");
  return head("inbox", `<span>${plural(items.length, "new post")}</span>`) + (chips.length ? `<div class="strip">${chips.join("")}</div>` : "") + cards;
}
function postsHtml(list) {
  if (!list.length) return head("my posts") + empty("No posts yet", "What you write on LETTIT shows up here.");
  return head("my posts", `<span>${plural(list.length, "post")}, newest first</span>`) + list.map((p) => {
    const root = p.id === p.thread_id;
    return `<article class="card"><div class="label">${root ? "thread" : "reply in · " + esc(p.title || "")}</div>${root ? `<h3>${esc(p.title)}</h3>` : ""}${meta(p, [plural(p.upvotes || 0, "upvote"), permalink(p, "open")])}<div class="body">${md(p.body)}</div></article>`;
  }).join("");
}
function show(result) {
  posts.clear();
  const sc = result.structuredContent;
  const text = result.content && result.content[0] && result.content[0].text;
  document.getElementById("app").innerHTML = result.isError ? empty("Something went wrong", text) : sc ? views(sc) : empty("Nothing to show", text);
}

// ---------- buttons ----------
document.addEventListener("click", async (e) => {
  const link = e.target.closest("[data-url]");
  if (link) { e.preventDefault(); return openLink(link.dataset.url); }
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const card = b.closest(".card");
  if (b.dataset.act === "open") return toggleOpen(b, card);
  if (b.dataset.act === "reply") return askClaude(b, card, posts.get(b.dataset.id));
});
async function toggleOpen(b, card) {
  const out = card.querySelector(".opened");
  if (out.innerHTML) { out.innerHTML = ""; b.textContent = "Open"; card.querySelector(".snippet").hidden = false; return; }
  b.disabled = true; b.textContent = "Opening…";
  try {
    const r = await callTool("open_thread", { id: b.dataset.id });
    const t = r.structuredContent && r.structuredContent.thread;
    out.innerHTML = t ? `<div class="body">${md(t.body)}</div>${countReplies(t) ? `<div class="replies">${t.children.map(replyHtml).join("")}</div>` : ""}` : `<div class="note">This thread is gone.</div>`;
    card.querySelector(".snippet").hidden = true;
    b.textContent = "Close";
  } catch (err) { out.innerHTML = `<div class="error">${esc(err.message)}</div>`; b.textContent = "Open"; }
  b.disabled = false;
}
// Reply keeps the user in the conversation: it puts a message in the chat naming the post, and Claude drafts the
// reply with them and posts it with the reply tool. The page itself never posts.
async function askClaude(b, card, p) {
  const note = card.querySelector(".sent");
  const excerpt = String(p.body || "").replace(/\s+/g, " ").slice(0, 280);
  const text = `Help me reply to ${p.author}'s post on LETTIT (post id ${p.id}${p.title ? `, in "${p.title}"` : ""}). They wrote: "${excerpt}${p.body && p.body.length > 280 ? "…" : ""}" Draft a reply with me, and post it with the reply tool once I'm happy with it.`;
  b.disabled = true;
  try {
    await request("ui/message", { role: "user", content: [{ type: "text", text }] });
    note.innerHTML = `<div class="note">Sent to Claude. Keep going in the chat below.</div>`;
  } catch (err) {
    note.innerHTML = `<div class="error">Couldn't reach the chat: ${esc(err.message)}</div>`;
    b.disabled = false;
  }
}
</script>
</body>
</html>
