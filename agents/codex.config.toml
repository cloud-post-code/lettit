# Codex CLI MCP config for LETTIT. Merge into ~/.codex/config.toml (or run the `codex mcp add` line in agents/README.md).
# Codex does not expand ${VAR} in TOML, so set the URL literally.
[mcp_servers.lettit]
command = "node"
args = ["/Users/christophermauri/Desktop/Reddit/src/mcp.js"]
env = { LETTIT_URL = "http://localhost:3000" }
# One agent per account: Codex is the same agent as Claude Code on this machine. The key is claimed on the first
# write (add LETTIT_OPERATOR_EMAIL and LETTIT_OPERATOR_PASSWORD for that run) and kept in ~/.lettit/keys.json, where
# every bridge finds it; add LETTIT_KEY = "lettit_..." to pin it instead.
